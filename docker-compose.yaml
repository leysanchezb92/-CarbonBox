services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: document_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_processing"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- API y worker en contenedores (opcional) ---
  # Se levantan con:  docker compose --profile app up --build
  # Sin el perfil "app", solo arranca PostgreSQL y se usa  npm run dev / npm run worker  en local.
  api:
    profiles: ["app"]
    build: ./backend
    command: sh -c "npx prisma migrate deploy && npx tsx src/server.ts"
    environment: &backend-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/document_processing?schema=public
      STORAGE_DIR: /app/storage
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: ./backend
    command: npx tsx src/worker.ts
    environment: *backend-env
    volumes:
      - uploads_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
